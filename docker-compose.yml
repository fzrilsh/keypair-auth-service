services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keypair}
      POSTGRES_USER: ${POSTGRES_USER:-keypair}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  key-init:
    image: alpine:3.20
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache openssl >/dev/null
        if [ ! -s /run/secrets/jwt-signing-private.pem ]; then
          openssl genpkey -algorithm ED25519 -out /run/secrets/jwt-signing-private.pem
        fi
        chmod 644 /run/secrets/jwt-signing-private.pem
    volumes:
      - jwtkeys:/run/secrets
    restart: "no"

  migrate:
    build: .
    image: keypair-auth-service:local
    entrypoint: ["/server", "migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-keypair}:${POSTGRES_PASSWORD:-local-only-password}@postgres:5432/${POSTGRES_DB:-keypair}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    image: keypair-auth-service:local
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-keypair}:${POSTGRES_PASSWORD:-local-only-password}@postgres:5432/${POSTGRES_DB:-keypair}?sslmode=disable
      JWT_SIGNING_PRIVATE_KEY_FILE: /run/secrets/jwt-signing-private.pem
      JWT_SIGNING_KEY_ID: ${JWT_SIGNING_KEY_ID:-local-dev-2026-09}
      ALLOWED_CLIENT_IDS: ${ALLOWED_CLIENT_IDS:-app-a,app-b}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-local-dev-only-admin-session-secret-change-me}
      HTTP_ADDR: :8080
      JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8080}
    volumes:
      - jwtkeys:/run/secrets:ro
    depends_on:
      key-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    ports:
      - "${HTTP_PORT:-8080}:8080"

volumes:
  pgdata:
  jwtkeys:
